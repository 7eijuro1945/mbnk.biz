<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f3f5">
  <title>Електронний квиток</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f3f5;
      --ink: #1a1a1a;
      --muted: #6b6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .home {
      width: min(380px, 100%);
      text-align: center;
    }
    h1 {
      font-size: 28px;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 28px;
    }
    .links {
      display: grid;
      gap: 12px;
    }
    a {
      display: grid;
      place-items: center;
      height: 52px;
      border-radius: 14px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font: 600 16px Inter, sans-serif;
    }
    a.secondary {
      background: #fff;
      color: #111;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
  </style>
</head>
<body>
  <main class="home">
    <h1>Електронний квиток</h1>
    <p>Оберіть транспорт</p>
    <div class="links">
      <a href="trolleybus/">Тролейбус</a>
      <a class="secondary" href="tram/">Трамвай</a>
    </div>
  </main>
</body>
</html>
